app = "voop-webapp"
primary_region = "sin"

[env]
NODE_ENV = "production"
PORT = "3000"
SHOPIFY_CLIENT_ID = "9e75868a20c3b7712800a03fbb4e89e2"

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
internal_port = 3000
min_machines_running = 1
processes = [ "app" ]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
memory_mb = 1024
